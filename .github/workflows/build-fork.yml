name: Build fork image
on:
  push:
    branches:
      - feature/ui-improvements-yt-transcript

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVER_VERSION=fork-${{ steps.sha.outputs.short }}
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/modeltok/karakeep:feature-ui-improvements-yt-transcript
            ghcr.io/modeltok/karakeep:${{ steps.sha.outputs.short }}
